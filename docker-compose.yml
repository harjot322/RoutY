version: '3.8'

services:
  mongo:
    image: mongo:6.0
    container_name: routy-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - routy-mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: routy-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/routy
      - JWT_SECRET=routy_civic_jwt_secret_2026_super_secure
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=RoutYAdmin2026!
      - CITY_NAME=Bhopal
      - STATE_NAME=Madhya Pradesh
      - OSRM_BASE_URL=https://router.project-osrm.org
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: routy-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api
      - VITE_SOCKET_URL=http://localhost:5000
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: routy-simulator
    restart: unless-stopped
    environment:
      - BACKEND_URL=http://backend:5000
      - UPDATE_INTERVAL_SEC=2.0
    depends_on:
      - backend

volumes:
  routy-mongo-data:
