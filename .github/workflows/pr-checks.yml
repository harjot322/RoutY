name: Pull Request Verification

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  backend-test:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        env:
          EXPO_PUBLIC_BACKEND_URL: http://127.0.0.1:8000
        run: |
          python -m uvicorn server:app --app-dir backend --host 127.0.0.1 --port 8000 &
          SERVER_PID=$!

          # Wait for server to be ready
          max_attempts=30
          attempt=0
          while [ $attempt -lt $max_attempts ]; do
            if curl -s http://127.0.0.1:8000/api/routes > /dev/null 2>&1; then
              echo "Server is ready (took ${attempt}s)"
              break
            fi
            attempt=$((attempt + 1))
            sleep 1
          done

          if [ $attempt -eq $max_attempts ]; then
            echo "Server failed to start within 30 seconds"
            kill $SERVER_PID 2>/dev/null || true
            exit 1
          fi

          python -m pytest backend/tests -v
          kill $SERVER_PID 2>/dev/null || true

  frontend-check:
    name: Frontend TypeScript Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'
          cache-dependency-path: frontend/yarn.lock

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          yarn install --frozen-lockfile || yarn install

      - name: Strict TypeScript Compilation Check
        working-directory: frontend
        run: |
          npx tsc --noEmit
